<?php
// Get current path
$requestUri = $_SERVER['REQUEST_URI'];
$matches = [];

// Check if it's a post route like /post/slug
if (preg_match('/^\/post\/([^\/]+)/', $requestUri, $matches)) {
    $slug = $matches[1];

    // Fetch post from WP API by slug
    $apiUrl = "https://tmdesigned.com/wp/wp-json/wp/v2/posts?slug=" . urlencode($slug) . "&_embed=1";
    $response = @file_get_contents($apiUrl);
    $postData = json_decode($response, true);

    if (!empty($postData)) {
        $post = $postData[0];
        $title = htmlspecialchars($post['title']['rendered']);
        $description = htmlspecialchars(strip_tags($post['excerpt']['rendered']));
        $image = $post['_embedded']['wp:featuredmedia'][0]['source_url'] ?? '/default-image.jpg'; // fallback
        $url = "https://tmdesigned.com$post['link']";
    }
}
